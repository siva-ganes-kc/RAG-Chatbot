[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sivaganes-4312", email = "sivaganes.kc@latentview.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
]

[project.scripts]
rag-chatbot = "rag_chatbot:main"

[build-system]
